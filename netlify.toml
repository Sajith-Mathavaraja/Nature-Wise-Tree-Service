[build]
  command = "npm run build"
  publish = "dist"

# ── SPA Routing (Fixes 404 on page refresh for /privacy-policy, /terms, etc.) ─
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache Headers for Netlify ────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
