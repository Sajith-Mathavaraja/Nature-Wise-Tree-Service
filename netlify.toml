[build]
  command = "npm run build"
  publish = "dist"

# ── Cache Headers for Netlify ────────────────────────────────────────────────
# Vite hashes every asset filename on build, so immutable 1-year cache is safe.
# This fixes the Lighthouse "Use efficient cache lifetimes" warning on Netlify.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
